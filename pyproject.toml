[project]
name = "vlmlabels"
version = "0.1.0"
description = "Label errors in vision-language benchmarks: annotation and re-scoring tools"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "pillow>=10.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "transformers>=4.47",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
